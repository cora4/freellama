name: Test

on:
  workflow_dispatch: # allows manual triggering

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Hardware Check
      run: |
        if ! grep -q "avx512_vnni" /proc/cpuinfo; then
            echo "Architecture: AVX2 (haswell/zen3)"
            exit 1
            #wget -q https://github.com/cora4/ik_llama.cpp/releases/download/zen3-18-20254/llama-latest-bin-ubuntu-zen3.zip
            #wget -q https://github.com/cora4/ik_llama.cpp/releases/download/zen3-21-30934/llama-latest-bin-ubuntu-zen3.zip -O llama-2.zip
        elif grep -q "Intel" /proc/cpuinfo; then
            echo "Company: Intel"
            if grep -q "avx512_bf16" /proc/cpuinfo; then
                if lscpu | grep L1i | grep -q "128 KiB"; then
                    echo "Architecture: Granite Rapids"
                else
                    echo "Architecture: Emerald Rapids"
                fi
                #wget -q https://github.com/cora4/ik_llama.cpp/releases/download/spr-28-25/llama-latest-bin-ubuntu-spr.zip -O llama-2.zip
            else
                if lscpu | grep -q "PLATINUM 8573C"; then
                    echo "No BF16"
                    echo "Architecture: Emerald Rapids"
                    exit 1
                fi
                echo "Architecture: Ice Lake"
                #wget -q https://github.com/cora4/ik_llama.cpp/releases/download/tgl-69-????/llama-latest-bin-ubuntu-tgl.zip  -O llama-3.zip
            fi
        else
            if grep -q "AMD" /proc/cpuinfo; then
                if lscpu | grep "CPU family"|grep -q 25; then
                    echo "Architecture: Zen 4"
                else    
                    echo "Architecture: Zen 5"
                fi
                # wget -q https://github.com/cora4/ik_llama.cpp/releases/download/zen4-19-14370/llama-latest-bin-ubuntu-zen4.zip
            fi
        fi
        wget -q https://github.com/ingodio/ik_llama.cpp/releases/download/icl-2-503/llama-latest-bin-ubuntu-icl.zip
        wget -q https://github.com/ingodio/ik_llama.cpp/releases/download/icl-1-32243/llama-latest-bin-ubuntu-icl.zip  -O llama-2.zip

        #wget -q https://github.com/ingodio/ik_llama.cpp/releases/download/tgl-1-23066/llama-latest-bin-ubuntu-tgl.zip
        #wget -q https://github.com/ingodio/ik_llama.cpp/releases/download/tgl-3-9976/llama-latest-bin-ubuntu-tgl.zip  -O llama-2.zip

        #wget -q https://github.com/ggml-org/llama.cpp/releases/download/b11195/llama-b11195-bin-ubuntu-x64.tar.gz -O llama-4.tar.gz
        #tar --no-overwrite-dir -xf llama-4.tar.gz -C /tmp/
        unzip -qo llama-2.zip -d /tmp/2/
        rm llama-2.zip
        #rm llama-4.tar.gz
        
    - name: Download Dependencies
      id: dl
      run: |
        #wget -q https://github.com/cora4/kernel_build_action/releases/download/main-13/qwen3-4B-Q2_0.gguf
        #wget -q https://github.com/cora4/ik_llama.cpp/releases/download/a/qwen3-1.7B-Q2_0.gguf
        #ln -s qwen3-1.7B-Q2_0.gguf qwen3-4B-Q2_0.gguf
        wget -q https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b9596-9fcaed7/llama-prism-b9596-9fcaed7-bin-ubuntu-x64.tar.gz
    - name: Extract Binaries
      run: |
        unzip -o llama-latest-bin-ubuntu-spr.zip -d /tmp/ || \
        unzip -o llama-latest-bin-ubuntu-zen4.zip -d /tmp/ || \
        unzip -o llama-latest-bin-ubuntu-tgl.zip -d /tmp/ || \
        unzip -o llama-latest-bin-ubuntu-icl.zip -d /tmp/ || \
        unzip -o llama-latest-bin-ubuntu-zen3.zip -d /tmp/
        tar --no-overwrite-dir -xf llama-prism-b9596-9fcaed7-bin-ubuntu-x64.tar.gz -C /tmp/ || true
        # rm /tmp/llama-prism-b9596-9fcaed7/libggml-cpu-sapphirerapids.so
        rm /tmp/llama-prism-b9596-9fcaed7/libggml-cpu-alderlake.so
        rm /tmp/llama-prism-b9596-9fcaed7/libggml-cpu-cooperlake.so
        
    - name: System Information
      run: |
        mount
        free -h
        echo "Current Directory: $PWD"
        echo "CPU Cores:"
        lscpu
        cat /proc/cpuinfo
        
    - name: Verify Binary Versions
      run: |
        echo "Testing Llama Latest:"
        /tmp/llama-latest/llama-server --version
        echo "Testing Llama Prism:"
        /tmp/llama-prism-b9596-9fcaed7/llama-server --version
        
