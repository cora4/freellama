    - name: Quantise Model IQ4_XS
      run: |
        wget -q https://github.com/cora4/kernel_build_action/releases/download/main-33/qwen3-4B-IQ4_XS.gguf -O /tmp/qwen3-4B-IQ4_XS.gguf
        
    - name: Benchmark Models (latest) IQ4_XS (-rtr 1)
      run: |
        echo "Benchmarking Quantised Model (Latest):"
        /tmp/llama-latest/llama-bench -rtr 1 -m /tmp/qwen3-4B-IQ4_XS.gguf -ub 1024 -p 1024
        
